# Координаты в пикселях экрана (горизонтально). Lenovo Legion Y700: 2560x1600.
# Уточнить: Для разработчиков -> 'Местоположение указателя'.
model: models/best.pt        # для run_pc.py; run_shizuku.py берёт models/best.onnx
conf: 0.4
move_joystick: [330, 1300]     # центр левого джойстика (уточнить!)
attack_joystick: [2230, 1300]  # центр правого джойстика (уточнить!)
joystick_radius: 200
attack_range: 550              # дальность атаки бойца, px
loop_delay: 0.05

# Броулбол
goal_dir: -90         # направление к воротам врага в градусах (-90 = вверх)
have_ball_dist: 120   # мяч ближе этого (px) = мяч у нас
carry_time: 2.5       # сколько секунд вести мяч перед ударом
