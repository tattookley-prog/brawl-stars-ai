# Координаты в пикселях экрана телефона (горизонтальная ориентация).
# Узнать: Настройки разработчика -> 'Отображать касания / Местоположение указателя'.
model: models/best.pt
conf: 0.4
move_joystick: [300, 850]    # центр левого джойстика
attack_joystick: [1900, 850] # центр правого джойстика
joystick_radius: 150
attack_range: 450            # дальность атаки бойца в пикселях
loop_delay: 0.05
